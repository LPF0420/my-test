<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6fb" />
      <stop offset="1" stop-color="#e6e6e1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#d5d5ce" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" opacity="0.45" />
  <circle cx="650" cy="110" r="150" fill="#c8dbef" opacity="0.45" />
  <circle cx="120" cy="430" r="90" fill="#a2c0de" opacity="0.25" />

  <g fill="#8a8a82" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="248" font-size="15" letter-spacing="6" fill="#749fc7">PROJECT COVER</text>
    <text x="64" y="300" font-size="34" font-weight="600" fill="#4f4f49">TODO: 项目封面占位</text>
    <text x="64" y="338" font-size="15" fill="#8a8a82">
      替换为 public/projects/ 下的真实截图，尺寸建议 1600×1000
    </text>
  </g>

  <g stroke="#b0b0a8" stroke-width="2" stroke-linecap="round" opacity="0.7">
